alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602828
    slo: fast_successful_requests (latency_ms <= 3000, 99.5% / 28d)
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2 OR tool_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602828
    slo: fast_successful_requests + guardrails.error_rate_pct_max=2, retrieval_success_rate_pct_min=90
    runbook: docs/alerts.md#alert-2
  - name: CostPerRequestSpike
    severity: warning
    condition: 'avg(response_sent.cost_usd) > 0.004 OR sum(response_sent.cost_usd) over 1h > 0.104'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602828
    slo: guardrails.daily_cost_usd_max=2.5 (0.104 USD/h); baseline avg ~0.0019 USD/request
    runbook: docs/alerts.md#alert-3
